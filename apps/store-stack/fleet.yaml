# Fleet Configuration for Store Stack
#
# This file controls how Fleet deploys the store-stack to different clusters.
# 
# Values are layered in this order (later overrides earlier):
#   1. values.yaml (defaults)
#   2. versions/<release-version>.yaml (image tags per release)
#   3. clusters/<cluster-name>.yaml (cluster-specific config)

namespace: default

helm:
  releaseName: store-stack
  
  # Base values files (applied to all clusters)
  valuesFiles:
    - values.yaml

# Per-cluster customizations
# Each cluster gets its version-specific + cluster-specific values
targetCustomizations:
  # -------------------------------------------
  # saurabh-kubernetes-cluster (Production)
  # -------------------------------------------
  - name: saurabh-kubernetes-cluster
    clusterName: saurabh-kubernetes-cluster
    helm:
      valuesFiles:
        - values.yaml
        - versions/v1.4.0.yaml
        - clusters/saurabh-kubernetes-cluster.yaml

# Uncomment when you have infrastructure layer
# dependsOn:
#   - name: storage
#   - name: networking
