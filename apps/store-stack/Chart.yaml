# Umbrella Chart for Store Stack
# This chart pulls in all service dependencies from published Helm repository

apiVersion: v2
name: store-stack
description: Store Stack - Complete application deployment
version: 0.1.0
type: application

dependencies:
  - name: nginx-service
    version: "0.3.0"
    repository: "https://saurabh-newera.github.io/helm-charts"
    
  - name: httpbin-service
    version: "0.3.0"
    repository: "https://saurabh-newera.github.io/helm-charts"
    
  - name: redis-service
    version: "0.3.0"
    repository: "https://saurabh-newera.github.io/helm-charts"
    
  - name: postgres
    version: "1.2.0"
    repository: "https://saurabh-newera.github.io/helm-charts"