# Cluster: anakin-cluster-2
# Environment: Pilot/Testing (for new version validation)
# Release: Controlled by cluster label 'release-version'
#
# This file contains cluster-specific configuration ONLY.
# Image tags are defined in versions/*.yaml

# -------------------------------------------
# NGINX Service
# -------------------------------------------
nginx-service:
  replicaCount: 1
  service:
    type: LoadBalancer
    loadBalancerIP: "10.200.30.1"
  resources:
    limits:
      cpu: "100m"
      memory: "128Mi"
    requests:
      cpu: "50m"
      memory: "64Mi"
  env:
    APP_ENV: "staging"

# -------------------------------------------
# HTTPBIN Service
# -------------------------------------------
httpbin-service:
  replicaCount: 1
  service:
    type: NodePort
    nodePort: 30082
  env:
    APP_ENV: "staging"
    LOG_LEVEL: "debug"

# -------------------------------------------
# Redis Service
# -------------------------------------------
redis-service:
  replicaCount: 1
  env:
    REDIS_MAXMEMORY: "128mb"

# -------------------------------------------
# PostgreSQL
# -------------------------------------------
postgres:
  replicaCount: 1
  service:
    type: LoadBalancer
    loadBalancerIP: "10.200.30.2"
  storage:
    size: "10Gi"
    storageClass: "longhorn"
  config:
    database: "anakin2_staging"
    user: "anakin2_admin"
