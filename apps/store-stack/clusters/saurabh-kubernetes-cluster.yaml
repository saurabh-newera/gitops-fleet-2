# Cluster: saurabh-kubernetes-cluster
# Environment: Production
# Release: Controlled by cluster label 'release-version'
#
# This file contains cluster-specific configuration ONLY.
# Image tags are defined in versions/*.yaml

# -------------------------------------------
# NGINX Service
# -------------------------------------------
nginx-service:
  replicaCount: 2
  service:
    type: LoadBalancer
    loadBalancerIP: "10.100.10.1"
  resources:
    limits:
      cpu: "210m"
      memory: "276Mi"
    requests:
      cpu: "80m"
      memory: "74Mi"
  env:
    APP_ENV: "production"

# -------------------------------------------
# HTTPBIN Service
# -------------------------------------------
httpbin-service:
  replicaCount: 2
  service:
    type: NodePort
    nodePort: 30080
  env:
    APP_ENV: "production"
    LOG_LEVEL: "info"

# -------------------------------------------
# Redis Service
# -------------------------------------------
redis-service:
  replicaCount: 1
  env:
    REDIS_MAXMEMORY: "256mb"

# -------------------------------------------
# PostgreSQL
# -------------------------------------------
postgres:
  replicaCount: 1
  service:
    type: LoadBalancer
    loadBalancerIP: "10.100.10.2"
  storage:
    size: "20Gi"
    storageClass: "longhorn"
  config:
    database: "saurabh_prod"
    user: "saurabh_admin"
