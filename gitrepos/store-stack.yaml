# =============================================================================
# GitRepo: Store Stack
# =============================================================================
#
# WHAT IS THIS?
# -------------
# This is a GitRepo Custom Resource that tells Fleet where to find your
# GitOps configuration. It's a ONE-TIME SETUP that connects Fleet to your
# gitops-fleet repository.
#
# HOW TO CREATE THIS ON RANCHER:
# ------------------------------
# Option 1: Via Rancher UI
#   1. Go to Rancher Dashboard
#   2. Navigate to: Continuous Delivery → Git Repos
#   3. Select namespace: fleet-default
#   4. Click "Create" and fill in the details below
#
# Option 2: Via kubectl (on the Rancher management cluster)
#   kubectl apply -f store-stack.yaml
#
# WHAT HAPPENS AFTER CREATION?
# ----------------------------
# Fleet will:
#   1. Clone the repository specified below
#   2. Read the fleet.yaml in apps/store-stack/
#   3. Build Bundles based on targetCustomizations
#   4. Deploy to matching downstream clusters automatically
#   5. Continuously sync changes (every 30s by default)
#
# FOR MORE DETAILS:
# See README.md for the full GitOps architecture and value layering explanation
#
# =============================================================================

apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: store-stack
  # fleet-default namespace is where GitRepos for downstream clusters live
  namespace: fleet-default
spec:
  # ===========================================
  # SOURCE: Where to pull the deployment config from
  # ===========================================
  # This points to your gitops-fleet repository (NOT the helm-charts repo)
  # The gitops-fleet repo contains:
  #   - fleet.yaml (targeting rules)
  #   - values.yaml (base defaults)
  #   - versions/*.yaml (release-specific image tags)
  #   - clusters/*.yaml (per-cluster configurations)
  repo: https://github.com/saurabh-newera/gitops-fleet-2
  branch: main
  
  # Path within the repo to the application configuration
  # Fleet will look for fleet.yaml in this directory
  paths:
    - apps/store-stack

  # ===========================================
  # TARGETS: Which clusters receive this deployment
  # ===========================================
  # This provides an initial filter. Fine-grained targeting is done
  # via targetCustomizations in fleet.yaml within the app directory.
  targets:
    - name: all-store-stack-clusters
      clusterSelector:
        matchExpressions:
          - key: release-version
            operator: In
            values:
              - "v1.4.0"
              - "v1.5.0"

  # ===========================================
  # POLLING INTERVAL
  # ===========================================
  # How often Fleet checks for changes in the Git repository
  # For edge deployments with 100s-1000s of clusters, 30s is a good balance
  pollingInterval: 30s
