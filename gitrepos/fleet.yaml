# Fleet Configuration for GitRepo Definitions
#
# This fleet.yaml tells Fleet to deploy the GitRepo CRDs in this folder
# to the LOCAL management cluster (where Fleet controller runs).
#
# SETUP:
# 1. Add this gitops-fleet-2 repo to Fleet in the 'fleet-local' namespace
# 2. Point it to the 'gitrepos/' path
# 3. Fleet will deploy the GitRepo resources to fleet-default namespace
#
# In Rancher UI:
#   Continuous Delivery → Git Repos → (switch to fleet-local) → Add Repository
#   - Name: gitops-fleet-gitrepos
#   - Repository URL: https://github.com/saurabh-newera/gitops-fleet-2
#   - Branch: main
#   - Paths: gitrepos

defaultNamespace: fleet-default

targets:
  - name: local-cluster
    clusterSelector:
      matchLabels:
        management.cattle.io/cluster-display-name: local
